<!doctype html>
<meta charset="utf-8">
<title>LangGraph agent</title>
<h1>LangGraph agent</h1>
<form id="f"><input id="q" size="50" placeholder="What is 12 * 34 + 5?"> <button>Ask</button></form>
<pre id="out"></pre>
<script>
f.onsubmit = async (e) => {
  e.preventDefault();
  out.textContent = "";
  const res = await fetch("chat", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ message: q.value }),
  });
  if (!res.ok) { out.textContent = (await res.json()).detail; return; }
  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += value;
    const events = buffer.split("\r\n\r\n");
    buffer = events.pop();
    for (const event of events) {
      for (const line of event.split("\r\n")) {
        if (line.startsWith("data: ")) out.textContent += JSON.parse(line.slice(6));
      }
    }
  }
};
</script>
