<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keras image classifier</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  img { max-width: 100%; max-height: 20rem; display: block; margin: 1rem 0; }
  li { margin: 0.25rem 0; }
</style>
<h1>Keras image classifier</h1>
<p>Pick a photo. MobileNetV2 (Keras, on CPU) says what is in it.</p>
<input id="file" type="file" accept="image/*">
<img id="preview" alt="" hidden>
<p id="status"></p>
<ol id="out"></ol>
<script>
file.onchange = async () => {
  const picked = file.files[0];
  if (!picked) return;
  preview.src = URL.createObjectURL(picked);
  preview.hidden = false;
  out.innerHTML = "";
  status.textContent = "Thinking…";
  const body = new FormData();
  body.append("image", picked);
  const res = await fetch("classify", { method: "POST", body });
  const reply = await res.json();
  if (!res.ok) { status.textContent = reply.detail; return; }
  status.textContent = "";
  for (const { label, score } of reply.predictions) {
    const item = document.createElement("li");
    item.textContent = `${label} — ${(score * 100).toFixed(1)}%`;
    out.append(item);
  }
};
</script>
